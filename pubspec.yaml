name: foss_warn
description: A FOSS client for the FOSS Public Alert Server
publish_to: 'none'
version: 1.1.1+45

environment:
  sdk: ">=3.6.2 <4.0.0"
  flutter: ">=3.41.9"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.1.0
  flutter_local_notifications: ^17.2.4
  shared_preferences: ^2.5.3
  shared_preferences_android: ^2.4.10
  rxdart: ^0.28.0
  url_launcher: ^6.3.1
  share_plus: ^13.3.0
  intl: any # for localizations
  unifiedpush: ^6.2.0
  unifiedpush_linux: ^1.0.0
  unifiedpush_android: ^3.4.1
  unifiedpush_storage_shared_preferences: ^1.0.0
  unifiedpush_platform_interface: ^4.0.0
  xml2json: ^6.2.5
  uuid: ^4.4.2
  android_alarm_manager_plus: ^5.0.0
  package_info_plus: ^10.2.1

  # used by the map
  flutter_map: ^7.0.2
  flutter_map_geojson: ^1.0.5
  vector_map_tiles: ^8.0.0
  latlong2: ^0.9.0

  #icons_launcher: ^2.1.6

  path_provider: any
  vector_tile_renderer: any
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  permission_handler: ^12.0.1
  permission_handler_android: ^13.0.1
  permission_handler_platform_interface: ^4.3.0
  geolocator: ^14.0.3

# geolocator_android depends on com.google.android.gms:play-services-location,
# which is non-free and makes F-Droid refuse to build the app. Excluding the
# artifact via Gradle does not work — the classes still end up in the APK, see
# https://github.com/Baseflow/flutter-geolocator/issues/1481
#
# The fork below removes the fused location provider so the plugin always uses
# the AOSP LocationManager. It is pinned by commit and kept
# in sync with upstream by a workflow in that repository.
dependency_overrides:
  geolocator_android:
    git:
      url: https://github.com/nucleus-ffm/flutter-geolocator.git
      path: geolocator_android
      ref: 969e51c0ff1fea1053e590b34c6f0930652d321f

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # used to swap in an in-memory preferences store in tests
  shared_preferences_platform_interface: ^2.4.1

icons_launcher:
  image_path: "assets/app_icon/app_icon.png"
  platforms:
    android:
      enable: true
      image_path: "assets/app_icon/app_icon.png"
      adaptive_background_color: '#cfe5ff'
      adaptive_foreground_image: "assets/app_icon/adaptive_icon.png"
      adaptive_monochrome_image: "assets/app_icon/adaptive_monochrome_app_icon.png"

flutter:
  generate: true # for localizations
  uses-material-design: true
  assets:
   # welcome screen
   - assets/app_icon/app_icon.png
   - assets/introduction/darkmode/
   - assets/introduction/lightmode/
